<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Geo">
<title>Daily Geo</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#0F1B2A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0F1B2A;
    --ink-soft: #16273B;
    --parchment: #EDE6D6;
    --parchment-dim: #DDD3BC;
    --brass: #B8935F;
    --brass-dim: #8A6D48;
    --sage: #7A9B7E;
    --rust: #B0654A;
    --line: rgba(237, 230, 214, 0.14);
    --text-primary: #EDE6D6;
    --text-secondary: rgba(237, 230, 214, 0.56);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--ink);
    color: var(--text-primary);
    font-family: 'Work Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 44px 20px 56px;
  }

  /* Header */
  header {
    margin-bottom: 30px;
  }

  .eyebrow-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 6px;
  }

  .date {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .streak {
    font-size: 13px;
    color: var(--brass);
    font-weight: 500;
  }

  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-optical-sizing: auto;
    font-weight: 500;
    font-size: 40px;
    line-height: 1.05;
    letter-spacing: -0.01em;
    color: var(--parchment);
  }

  .edit-toggle {
    background: none;
    border: 1px solid var(--line);
    color: var(--text-secondary);
    font-family: 'Work Sans', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 7px 13px;
    border-radius: 20px;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.2s ease;
  }

  .edit-toggle.active {
    color: var(--ink);
    background: var(--brass);
    border-color: var(--brass);
  }

  .subhead {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-secondary);
    max-width: 42ch;
  }

  /* Progress */
  .progress-block {
    margin: 26px 0 8px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }

  .progress-fill {
    height: 100%;
    background: var(--brass);
    border-radius: 2px;
    transition: width 0.45s cubic-bezier(0.65, 0, 0.35, 1);
    width: 0%;
  }

  .progress-label {
    font-size: 12.5px;
    color: var(--text-secondary);
    font-variant-numeric: tabular-nums;
  }

  .progress-label strong {
    color: var(--parchment);
    font-weight: 600;
  }

  /* List */
  .manifest {
    margin-top: 34px;
    border-top: 1px solid var(--line);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--line);
    background: var(--ink);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .row.dragging {
    opacity: 0.4;
  }

  .row-tap {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    min-width: 0;
    cursor: pointer;
    background: none;
    border: none;
    text-align: left;
    color: inherit;
    font: inherit;
    padding: 0;
    -webkit-appearance: none;
    appearance: none;
  }

  .row-tap:active {
    opacity: 0.6;
  }

  .row-index {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    color: var(--text-secondary);
    width: 20px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .row.done .row-index {
    color: var(--sage);
  }

  .row-icon {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--ink-soft);
  }

  .row-body {
    flex: 1;
    min-width: 0;
  }

  .row-name {
    font-size: 16.5px;
    font-weight: 500;
    color: var(--parchment);
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row.done .row-name {
    color: var(--text-secondary);
    text-decoration: line-through;
    text-decoration-color: rgba(237, 230, 214, 0.3);
    text-decoration-thickness: 1px;
  }

  .row-domain {
    font-size: 12.5px;
    color: var(--text-secondary);
  }

  .row-check {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .row.done .row-check {
    background: var(--sage);
    border-color: var(--sage);
  }

  .row-check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s cubic-bezier(0.65, 0, 0.35, 1);
  }

  .row.done .row-check svg {
    opacity: 1;
    transform: scale(1);
  }

  /* Edit mode controls */
  .row-edit-controls {
    display: none;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .row.edit-mode .row-edit-controls {
    display: flex;
  }

  .row.edit-mode .row-check {
    display: none;
  }

  .order-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .order-btn {
    width: 26px;
    height: 18px;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
  }

  .order-btn:active {
    background: var(--ink-soft);
    color: var(--brass);
  }

  .order-btn:disabled {
    opacity: 0.25;
    cursor: default;
  }

  .order-btn svg {
    width: 13px;
    height: 13px;
  }

  .remove-btn {
    width: 30px;
    height: 30px;
    background: none;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    margin-left: 4px;
    flex-shrink: 0;
  }

  .remove-btn:active {
    background: rgba(176, 101, 74, 0.18);
    color: var(--rust);
  }

  .remove-btn svg {
    width: 15px;
    height: 15px;
  }

  /* Drag handle */
  .drag-handle {
    display: none;
    width: 20px;
    height: 30px;
    flex-shrink: 0;
    color: var(--text-secondary);
    cursor: grab;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }

  .row.edit-mode .drag-handle {
    display: flex;
  }

  .drag-handle svg {
    width: 14px;
    height: 14px;
  }

  /* Add game form */
  .add-form {
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 18px 0 6px;
    border-bottom: 1px solid var(--line);
  }

  .add-form.show {
    display: flex;
  }

  .add-form input {
    background: var(--ink-soft);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--parchment);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    outline: none;
  }

  .add-form input:focus {
    border-color: var(--brass-dim);
  }

  .add-form input::placeholder {
    color: var(--text-secondary);
  }

  .add-form-row {
    display: flex;
    gap: 8px;
  }

  .add-btn {
    background: var(--brass);
    border: none;
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 2px;
  }

  .add-btn:active {
    background: var(--brass-dim);
  }

  .add-error {
    font-size: 12.5px;
    color: var(--rust);
    display: none;
  }

  .add-error.show {
    display: block;
  }

  .empty-state {
    padding: 40px 0;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
  }

  /* Footer */
  .footer {
    margin-top: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .reset-btn {
    background: none;
    border: none;
    color: var(--text-secondary);
    font-family: 'Work Sans', sans-serif;
    font-size: 13px;
    cursor: pointer;
    padding: 8px 0;
  }

  .reset-btn:active {
    color: var(--brass);
  }

  .complete-msg {
    font-family: 'Fraunces', serif;
    font-size: 13px;
    font-style: italic;
    color: var(--sage);
    opacity: 0;
    transition: opacity 0.4s ease;
  }

  .complete-msg.show {
    opacity: 1;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="eyebrow-row">
        <span class="date" id="date"></span>
        <span class="streak" id="streak"></span>
      </div>
      <div class="title-row">
        <h1>Daily Geo</h1>
        <button class="edit-toggle" id="editToggle">Edit list</button>
      </div>
      <p class="subhead">Today's route through the map games. Tap one to open it, come back and check it off.</p>
    </header>

    <div class="progress-block">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="progress-label" id="progressLabel"></div>
    </div>

    <div class="add-form" id="addForm">
      <div class="add-form-row">
        <input type="text" id="addName" placeholder="Game name (e.g. Tradle)">
      </div>
      <input type="url" id="addUrl" placeholder="URL (e.g. https://worldle.teuteuf.fr)">
      <span class="add-error" id="addError">Enter a name and a valid URL.</span>
      <button class="add-btn" id="addSubmit">Add game</button>
    </div>

    <div class="manifest" id="manifest"></div>

    <div class="footer">
      <button class="reset-btn" id="resetBtn">Reset today's checks</button>
      <span class="complete-msg" id="completeMsg">all stamped — see you tomorrow</span>
    </div>
  </div>

<script>
  // ---- Default games (used only the first time, before any edits are saved) ----
  const DEFAULT_GAMES = [
    { id: "oec-world",           name: "OEC Tradle",  domain: "oec.world",           url: "https://oec.world/en/tradle" },
    { id: "worldle-teuteuf-fr",  name: "Worldle",     domain: "worldle.teuteuf.fr",  url: "https://worldle.teuteuf.fr" },
    { id: "geoguessr-com",       name: "GeoGuessr",   domain: "geoguessr.com",       url: "https://www.geoguessr.com" },
    { id: "reborder-app",        name: "Reborder",    domain: "reborder.app",        url: "https://reborder.app" },
    { id: "maptap-gg",           name: "MapTap.gg",   domain: "maptap.gg",           url: "https://maptap.gg" },
    { id: "travle-earth",        name: "travle",      domain: "travle.earth",        url: "https://travle.earth" },
    { id: "geogridgame-com",     name: "GeoGrid",     domain: "geogridgame.com",     url: "https://www.geogridgame.com" },
    { id: "hbd-gg",              name: "EthnoGuessr", domain: "hbd.gg",              url: "https://hbd.gg" }
  ];

  const GAMES_KEY = "dailygeo_games";
  const STORAGE_KEY = "dailygeo_progress";

  function loadGames() {
    try {
      const raw = JSON.parse(localStorage.getItem(GAMES_KEY));
      if (Array.isArray(raw) && raw.length) return raw;
    } catch (e) {}
    return DEFAULT_GAMES.slice();
  }

  function saveGames(games) {
    localStorage.setItem(GAMES_KEY, JSON.stringify(games));
  }

  let GAMES = loadGames();

  function makeId(url) {
    try {
      const domain = new URL(url).hostname.replace(/^www\./, "");
      return domain.replace(/[^a-z0-9]/gi, "-").toLowerCase() + "-" + Date.now().toString(36).slice(-4);
    } catch (e) {
      return "game-" + Date.now().toString(36);
    }
  }

  function domainOf(url) {
    try {
      return new URL(url).hostname.replace(/^www\./, "");
    } catch (e) {
      return url;
    }
  }

  function todayKey() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function loadState() {
    let raw;
    try {
      raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    } catch (e) {
      raw = {};
    }
    const key = todayKey();
    if (!raw.date || raw.date !== key) {
      const prevStreak = raw.streak || 0;
      const prevDone = raw.done || {};
      const prevIds = GAMES.map(g => g.id);
      const prevAll = raw.date && prevIds.length > 0 && prevIds.every(id => prevDone[id]);
      raw = {
        date: key,
        done: {},
        streak: prevAll ? prevStreak : 0
      };
      saveState(raw);
    }
    return raw;
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  let state = loadState();
  let editMode = false;
  let dragSrcIndex = null;

  function formatDate() {
    const d = new Date();
    return d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
  }

  function checkIcon() {
    return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 12L13 4" stroke="#0F1B2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function render() {
    document.getElementById("date").textContent = formatDate();

    const total = GAMES.length;
    const doneCount = GAMES.filter(g => state.done[g.id]).length;
    const pct = total ? Math.round((doneCount / total) * 100) : 0;

    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("progressLabel").innerHTML =
      "<strong>" + doneCount + "</strong> of " + total + " today";

    document.getElementById("streak").textContent = state.streak > 0 ? state.streak + " day streak" : "";

    const completeMsg = document.getElementById("completeMsg");
    completeMsg.classList.toggle("show", total > 0 && doneCount === total);

    const manifest = document.getElementById("manifest");
    manifest.innerHTML = "";

    if (GAMES.length === 0) {
      manifest.innerHTML = `<div class="empty-state">No games yet — add one above.</div>`;
      return;
    }

    GAMES.forEach((game, i) => {
      const isDone = !!state.done[game.id];
      const row = document.createElement("div");
      row.className = "row" + (isDone ? " done" : "") + (editMode ? " edit-mode" : "");
      row.draggable = editMode;
      row.dataset.index = i;

      const favicon = "https://www.google.com/s2/favicons?sz=64&domain=" + domainOf(game.url);

      row.innerHTML = `
        <span class="drag-handle" aria-hidden="true">
          <svg viewBox="0 0 16 16" fill="currentColor">
            <circle cx="5" cy="3" r="1.3"/><circle cx="11" cy="3" r="1.3"/>
            <circle cx="5" cy="8" r="1.3"/><circle cx="11" cy="8" r="1.3"/>
            <circle cx="5" cy="13" r="1.3"/><circle cx="11" cy="13" r="1.3"/>
          </svg>
        </span>
        <button class="row-tap" type="button" aria-label="${game.name}${isDone ? ', completed' : ''}">
          <span class="row-index">${String(i + 1).padStart(2, "0")}</span>
          <img class="row-icon" src="${favicon}" alt="" loading="lazy">
          <span class="row-body">
            <span class="row-name">${game.name}</span><br>
            <span class="row-domain">${domainOf(game.url)}</span>
          </span>
        </button>
        <span class="row-check">${checkIcon()}</span>
        <span class="row-edit-controls">
          <span class="order-btns">
            <button class="order-btn up-btn" type="button" aria-label="Move up" ${i === 0 ? "disabled" : ""}>
              <svg viewBox="0 0 16 16" fill="none"><path d="M3 10L8 5L13 10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="order-btn down-btn" type="button" aria-label="Move down" ${i === GAMES.length - 1 ? "disabled" : ""}>
              <svg viewBox="0 0 16 16" fill="none"><path d="M3 6L8 11L13 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </span>
          <button class="remove-btn" type="button" aria-label="Remove ${game.name}">
            <svg viewBox="0 0 16 16" fill="none"><path d="M4 4L12 12M12 4L4 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </span>
      `;

      // Tap to open + check off (disabled while editing)
      row.querySelector(".row-tap").addEventListener("click", () => {
        if (editMode) return;
        window.open(game.url, "_blank", "noopener");
        state.done[game.id] = true;
        saveState(state);
        render();
      });

      // Reorder via arrows
      const upBtn = row.querySelector(".up-btn");
      const downBtn = row.querySelector(".down-btn");
      upBtn.addEventListener("click", () => { moveGame(i, i - 1); });
      downBtn.addEventListener("click", () => { moveGame(i, i + 1); });

      // Remove
      row.querySelector(".remove-btn").addEventListener("click", () => {
        GAMES.splice(i, 1);
        saveGames(GAMES);
        render();
      });

      // Drag reorder (desktop / trackpad; touch devices use arrows above)
      row.addEventListener("dragstart", () => {
        dragSrcIndex = i;
        row.classList.add("dragging");
      });
      row.addEventListener("dragend", () => {
        row.classList.remove("dragging");
        dragSrcIndex = null;
      });
      row.addEventListener("dragover", (e) => {
        if (!editMode) return;
        e.preventDefault();
      });
      row.addEventListener("drop", (e) => {
        e.preventDefault();
        if (dragSrcIndex === null || dragSrcIndex === i) return;
        moveGame(dragSrcIndex, i);
      });

      manifest.appendChild(row);
    });
  }

  function moveGame(from, to) {
    if (to < 0 || to >= GAMES.length) return;
    const [item] = GAMES.splice(from, 1);
    GAMES.splice(to, 0, item);
    saveGames(GAMES);
    render();
  }

  document.getElementById("resetBtn").addEventListener("click", () => {
    state.done = {};
    saveState(state);
    render();
  });

  document.getElementById("editToggle").addEventListener("click", () => {
    editMode = !editMode;
    document.getElementById("editToggle").classList.toggle("active", editMode);
    document.getElementById("editToggle").textContent = editMode ? "Done" : "Edit list";
    document.getElementById("addForm").classList.toggle("show", editMode);
    render();
  });

  document.getElementById("addSubmit").addEventListener("click", () => {
    const nameInput = document.getElementById("addName");
    const urlInput = document.getElementById("addUrl");
    const errorEl = document.getElementById("addError");
    const name = nameInput.value.trim();
    let url = urlInput.value.trim();

    if (url && !/^https?:\/\//i.test(url)) {
      url = "https://" + url;
    }

    let validUrl = false;
    try {
      new URL(url);
      validUrl = true;
    } catch (e) {
      validUrl = false;
    }

    if (!name || !validUrl) {
      errorEl.classList.add("show");
      return;
    }
    errorEl.classList.remove("show");

    GAMES.push({ id: makeId(url), name, url });
    saveGames(GAMES);

    nameInput.value = "";
    urlInput.value = "";
    render();
  });

  render();
</script>
</body>
</html>
